<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZUVI Script 演示</title>
    <link rel="stylesheet" href="./cdn/v0.4.0/zuvi.css" />
  </head>
  <body style="padding: 24px">
    <main id="root"></main>
    <script src="./cdn/v0.4.0/zuvi.global.js"></script>
    <script>
      const root = ZUVI.createRoot(document.getElementById('root'));
      root.render(
        ZUVI.React.createElement(
          ZUVI.Button,
          {
            variant: 'primary',
            onClick: (event) => {
              event.currentTarget.textContent = '点击成功';
            },
          },
          'ZUVI 按钮'
        )
      );
    </script>
  </body>
</html>
