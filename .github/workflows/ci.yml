name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node registry/scripts/generate.mjs --check
      - run: pnpm -r build
      - run: pnpm --filter @zuvi/react build:browser
      - run: pnpm -r typecheck
      - run: pnpm lint
      # a11y: axe-core 扫描已包含在 packages/ui 测试套件（src/test/a11y.axe.test.tsx）
      - run: pnpm -r test
      - name: Validate published ESM and CommonJS entries
        run: node scripts/check-distribution.mjs
      - name: Compile installed sources and MCP examples
        run: node scripts/check-consumer.mjs
      - name: Check complete entry bundle budget (JS gzip < 124928 bytes)
        run: node scripts/check-bundle-size.mjs

  # 完整浏览器回归按 shard 分摊到三个 runner：每个用例仍恰好执行一次（--workers=1、
  # 无重试、无跳过）；单 runner 连续承载全部 321 个 OfficeStudio 重用例会因内存与
  # 时长累积在套件深位出现浏览器崩溃/超时（2026-11-28 两轮 CI 观测），分片是环境
  # 容量对策，不改变任何断言。
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # e2e 的 vite dev 服务消费 UI 与 blocks 的 dist 入口（含 style.css 与依赖
      # 预扫描），CDN 离线用例读取 dist/browser；与 ci job 一致做全量构建，
      # 避免闭包遗漏再次出现在 vite dep-scan 阶段。
      - run: pnpm -r build
      - run: pnpm --filter @zuvi/react build:browser
      - run: pnpm exec playwright test --config e2e/playwright.config.ts --shard=${{ matrix.shard }}/3 --workers=1
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-shard-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
