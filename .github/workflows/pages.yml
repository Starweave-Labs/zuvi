name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 文档直接依赖 blocks/i18n/icons/react/tokens；先按依赖拓扑构建全部工作区依赖。
      - run: pnpm --filter '@zuvi/docs^...' build
      - run: pnpm --filter @zuvi/docs build
        env:
          GITHUB_PAGES_BUILD: 'true'
      - run: pnpm --filter @zuvi/react build:browser
      # cdn-demo.html 的版本引用随每次发布自动重写（vite.browser.config.ts
      # 的 closeBundle 已把浏览器产物归档到 docs/dist/cdn/v<version>/）
      - run: node -e "const fs=require('fs');const v=require('./packages/ui/package.json').version;fs.writeFileSync('docs/dist/cdn-demo.html',fs.readFileSync('docs/public/cdn-demo.html','utf8').replace(/cdn\/v[0-9.]+\//g,'cdn/v'+v+'/'))"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
