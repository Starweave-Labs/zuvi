name: Publish npm

# 发布 @zuvi/* 七包到 npmjs.com（公网，unpkg 自动托管）。
# 前提：仓库 Secret NPM_TOKEN（npm Granular Token，All packages + Read and write）。
# provenance：Sigstore 签名走 GitHub Actions OIDC（id-token: write），npm 要求
# package.json 声明指向本仓库的 repository 字段（七个包均已声明）。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@zuvi'

      # provenance 前提自检：证明本运行可取到 GitHub OIDC 令牌（id-token: write）
      # 且 repository 声明与期望一致。npm publish --provenance 走的就是这条链
      # （GitHub → Sigstore → npm），此处提前失败可避免发布中途才发现签名不可用。
      - name: Verify OIDC for provenance
        env:
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          response=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npmjs://www.npmjs.com")
          node -e '
            const expected = process.argv[1];
            const jwt = JSON.parse(process.argv[2]).value;
            const payload = JSON.parse(Buffer.from(jwt.split(".")[1], "base64url").toString("utf8"));
            const claims = {
              repository: payload.repository,
              ref: payload.ref,
              job_workflow_ref: payload.job_workflow_ref,
              issuer: payload.iss,
            };
            console.log("OIDC claims:", JSON.stringify(claims, null, 2));
            if (claims.repository !== expected) {
              console.error(`::error::OIDC repository=${claims.repository} 与期望 ${expected} 不匹配，provenance 会被 npm 拒签`);
              process.exit(1);
            }
            if (claims.issuer !== "https://token.actions.githubusercontent.com") {
              console.error(`::error::OIDC issuer=${claims.issuer} 非 GitHub Actions`);
              process.exit(1);
            }
            console.log("✓ OIDC 链路就绪，provenance 签名前提成立");
          ' "$EXPECTED_REPO" "$response"

      # NPM_TOKEN 未配置时整段跳过（通知而非失败，避免 release 触发的运行空报错）
      - name: Guard NPM_TOKEN
        id: guard
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::NPM_TOKEN 未配置，跳过 npm 发布。配置方法见 docs/GITHUB-PACKAGES.md 旁边的 npm 发布章节。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.skip != 'true'
      - run: node registry/scripts/generate.mjs --check
        if: steps.guard.outputs.skip != 'true'
      - run: pnpm -r build
        if: steps.guard.outputs.skip != 'true'
      - run: pnpm --filter @zuvi/react build:browser
        if: steps.guard.outputs.skip != 'true'
      - run: node scripts/check-distribution.mjs
        if: steps.guard.outputs.skip != 'true'

      # 按依赖拓扑顺序发布；版本已存在则跳过（release 重跑幂等）
      - name: Publish @zuvi/* with provenance
        if: steps.guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in tokens icons i18n react blocks cli mcp; do
            want=$(node -p "require('./packages/$pkg/package.json').version")
            current=$(npm view "@zuvi/$pkg" version 2>/dev/null || echo "")
            if [ "$current" = "$want" ]; then
              echo "::notice::@zuvi/$pkg@$want 已存在于 npm，跳过"
              continue
            fi
            echo "Publishing @zuvi/$pkg@$want ..."
            (cd "packages/$pkg" && npm publish --provenance --access public)
          done

      - name: Verify published versions
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sleep 5
          for pkg in tokens icons i18n react blocks cli mcp; do
            want=$(node -p "require('./packages/$pkg/package.json').version")
            published=$(npm view "@zuvi/$pkg" version)
            test "$published" = "$want" || {
              echo "::error::@zuvi/$pkg 期望 $want，实际 $published"
              exit 1
            }
            echo "@zuvi/$pkg@$published ✓"
          done
